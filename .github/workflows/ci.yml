name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify
        env:
          COUNTERBALL_CALIBRATION_OUTPUT: .artifacts/counterball-calibration-observations.json
        run: pnpm verify
      - name: Upload calibration probe observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterball-calibration-observations
          path: .artifacts/counterball-calibration-observations.json
          if-no-files-found: ignore
      - run: pnpm test:integration
      - run: pnpm test:e2e --workers=1
